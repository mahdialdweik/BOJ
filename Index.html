<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Jordan - Interactive Talent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        boj: {
                            blue: '#004B87', // Corporate Blue
                            dark: '#002244', // Deep Blue for gradients
                            red: '#D32F2F',  // Accent Red
                            light: '#F1F5F9',
                            gray: '#475569'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8FAFC;
            -webkit-font-smoothing: antialiased;
        }
        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-dark {
            background: rgba(0, 75, 135, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Card Hover Effects */
        .job-card-hover {
            transition: all 0.2s ease-in-out;
        }
        .job-card-hover:hover {
            transform: scale(1.01) translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border-color: #cbd5e1;
        }
        /* Mobile Touch & Scroll Enhancements */
        @media (max-width: 768px) {
            .custom-scrollbar::-webkit-scrollbar {
                display: none; 
            }
            .custom-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
</head>

            <!-- Content will be injected here via JavaScript -->

            <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-boj-blue text-white rounded-lg hover:bg-blue-700 transition">Clear Filters</button>

            "KSA": "bg-emerald-100 text-emerald-800 border-emerald-200",
            "Iraq": "bg-amber-100 text-amber-800 border-amber-200",

        const chartColors = {
            "Jordan": '#004B87',
            "KSA": '#10B981',
            "Iraq": '#F59E0B',
            "Bahrain": '#EF4444',
            "Palestine": '#8B5CF6'
        };

        const locationFlags = {
            "Jordan": "🇯🇴", "KSA": "🇸🇦", "Iraq": "🇮🇶", "Bahrain": "🇧🇭", "Palestine": "🇵🇸"
        };

        // State variables
        let currentData = [...rawJobData];
        let activeCountryFilter = 'All';
        let charts = {};


        function getFilteredData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            return rawJobData.filter(job => {
                const matchesSearch = job.title.toLowerCase().includes(searchTerm) || 
                                      job.dept.toLowerCase().includes(searchTerm) || 
                                      job.loc.toLowerCase().includes(searchTerm);
                const matchesCountry = activeCountryFilter === 'All' || job.country === activeCountryFilter;
                return matchesSearch && matchesCountry;
            });
        }

        function updateDashboard() {
            currentData = getFilteredData();
            
            updateCounters(currentData);
            renderGrid(currentData);
            updateCharts(currentData);

            const grid = document.getElementById('departments-grid');
            const emptyState = document.getElementById('empty-state');
            
            if (currentData.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }
        }

        function updateCounters(data) {
            const groupedByCountry = data.reduce((acc, job) => { acc[job.country] = true; return acc; }, {});
            const groupedByDept = data.reduce((acc, job) => { acc[job.dept] = true; return acc; }, {});

            // Animate counters
            animateValue("stat-roles", parseInt(document.getElementById("stat-roles").innerText) || 0, data.length, 500);
            animateValue("stat-countries", parseInt(document.getElementById("stat-countries").innerText) || 0, Object.keys(groupedByCountry).length, 500);
            animateValue("stat-depts", parseInt(document.getElementById("stat-depts").innerText) || 0, Object.keys(groupedByDept).length, 500);
        }

        function animateValue(id, start, end, duration) {
            if (start === end) return;
            let range = end - start;
            let current = start;
            let increment = end > start ? 1 : -1;
            let stepTime = Math.abs(Math.floor(duration / range));
            let obj = document.getElementById(id);
            let timer = setInterval(function() {
                current += increment;
                obj.innerHTML = current;
                if (current == end) {
                    clearInterval(timer);
                }
            }, stepTime);
        }

        function buildFilters() {
            const filterContainer = document.getElementById('country-filters');
            const countries = ['All', ...new Set(rawJobData.map(job => job.country))];
            
            filterContainer.innerHTML = '';
            countries.forEach(country => {
                const btn = document.createElement('button');
                const isAll = country === 'All';
                
                let baseClasses = "whitespace-nowrap px-5 py-2 md:py-1.5 rounded-full text-sm font-medium transition-all duration-200 border snap-start touch-manipulation ";
                let activeClasses = isAll ? "bg-boj-blue text-white border-boj-blue shadow-md" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50";
                
                btn.className = baseClasses + activeClasses;
                btn.innerHTML = isAll ? 'Global View' : `${locationFlags[country]} ${country}`;
                
                btn.onclick = (e) => {
                    // Update active state visuals
                    document.querySelectorAll('#country-filters button').forEach(b => {
                        b.className = baseClasses + "bg-white text-slate-600 border-slate-200 hover:bg-slate-50";
                    });
                    btn.className = baseClasses + "bg-boj-blue text-white border-boj-blue shadow-md";
                    
                    activeCountryFilter = country;
                    updateDashboard();
                };
                filterContainer.appendChild(btn);
            });
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            activeCountryFilter = 'All';
            buildFilters();
            updateDashboard();
        }

        function renderGrid(data) {
            const gridContainer = document.getElementById('departments-grid');
            gridContainer.innerHTML = '';
            
            const groupedByDept = data.reduce((acc, job) => {
                acc[job.dept] = acc[job.dept] || [];
                acc[job.dept].push(job);
                return acc;
            }, {});

            const sortedDepts = Object.keys(groupedByDept).sort((a, b) => groupedByDept[b].length - groupedByDept[a].length);

            sortedDepts.forEach(dept => {
                const jobs = groupedByDept[dept];
                const theme = deptIcons[dept] || { icon: "fa-briefcase", color: "text-boj-blue", bg: "bg-blue-50" };
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col";
                
                let jobsHTML = '';
                jobs.forEach(job => {
                    const badgeClass = locationColors[job.country];
                    const flag = locationFlags[job.country];
                    const highlightClass = job.highlight ? 'bg-amber-50 border-l-4 border-l-amber-400' : 'border-l-4 border-l-transparent hover:bg-slate-50';
                    const statusIcon = job.highlight ? '<i class="fas fa-fire text-amber-500 mr-1"></i>' : '';
                    
                    jobsHTML += `
                        <div class="job-card-hover p-4 md:p-5 border-b border-slate-100 last:border-0 transition-colors relative cursor-pointer group ${highlightClass} touch-manipulation">
                            <div class="flex justify-between items-start mb-3 gap-3">
                                <h4 class="text-sm md:text-base font-bold text-slate-800 leading-snug group-hover:text-boj-blue transition-colors pr-2">${job.title}</h4>
                                <button class="opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity text-xs bg-boj-blue text-white px-3 py-1.5 lg:px-2 lg:py-1 rounded shadow-sm whitespace-nowrap active:scale-95">Apply</button>
                            </div>
                            
                            <div class="flex flex-wrap items-center gap-2 mb-2">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium border ${badgeClass}">
                                    <span class="mr-1">${flag}</span> ${job.loc}
                                </span>
                                <span class="text-xs text-slate-500 flex items-center">
                                    <i class="far fa-clock mr-1"></i> ${job.posted}
                                </span>
                            </div>
                            
                            <div class="text-xs text-slate-500 flex items-center mt-1">
                                ${statusIcon} <span class="${job.highlight ? 'text-amber-700 font-semibold' : ''}">${job.status}</span>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="${theme.bg} px-5 py-4 border-b border-slate-200 flex justify-between items-center sticky top-0 z-10">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg bg-white shadow-sm flex items-center justify-center border border-slate-100">
                                <i class="fas ${theme.icon} ${theme.color} text-base"></i>
                            </div>
                            <h3 class="font-bold text-slate-800 text-sm md:text-base">${dept}</h3>
                        </div>
                        <span class="bg-white text-slate-600 text-xs font-bold px-2.5 py-1 rounded-full border border-slate-200 shadow-sm">
                            ${jobs.length} Role${jobs.length > 1 ? 's' : ''}
                        </span>
                    </div>
                    <div class="flex-grow overflow-y-auto custom-scrollbar max-h-[400px]">
                        ${jobsHTML}
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        function initCharts() {
            Chart.defaults.font.family = 'Inter';
            Chart.defaults.color = '#64748b';
            
            const locCtx = document.getElementById('locationChart').getContext('2d');
            const getLegendPos = () => window.innerWidth < 768 ? 'bottom' : 'right';

            charts.location = new Chart(locCtx, {
                type: 'doughnut',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: getLegendPos(), labels: { usePointStyle: true, boxWidth: 8, padding: 15 } },
                        tooltip: { backgroundColor: 'rgba(0, 34, 68, 0.9)', padding: 12, cornerRadius: 8 }
                    },
                    cutout: '70%',
                    animation: { animateScale: true, animateRotate: true }
                }
            });

            const deptCtx = document.getElementById('departmentChart').getContext('2d');
            charts.department = new Chart(deptCtx, {
                type: 'bar',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: 'rgba(0, 34, 68, 0.9)', padding: 12, cornerRadius: 8 }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9', drawBorder: false } },
                        x: { ticks: { maxRotation: 45, minRotation: 45, autoSkip: false }, grid: { display: false, drawBorder: false } }
                    }
                }
            });
            
            updateCharts(rawJobData);
        }

        function updateCharts(data) {
            // Process Location Data
            const groupedByCountry = data.reduce((acc, job) => {
                acc[job.country] = (acc[job.country] || 0) + 1;
                return acc;
            }, {});
            
            const countries = Object.keys(groupedByCountry);
            const countryCounts = Object.values(groupedByCountry);
            const bgColors = countries.map(c => chartColors[c] || '#94a3b8');

            charts.location.data = {
                labels: countries,
                datasets: [{
                    data: countryCounts,
                    backgroundColor: bgColors,
                    borderWidth: 2,
                    borderColor: '#ffffff',
                    hoverOffset: 4
                }]
            };
            charts.location.update();

            // Process Department Data
            const groupedByDept = data.reduce((acc, job) => {
                acc[job.dept] = (acc[job.dept] || 0) + 1;
                return acc;
            }, {});
            
            const sortedDeptEntries = Object.entries(groupedByDept).sort((a, b) => b[1] - a[1]);
            
            charts.department.data = {
                labels: sortedDeptEntries.map(e => e[0]),
                datasets: [{
                    label: 'Open Roles',
                    data: sortedDeptEntries.map(e => e[1]),
                    backgroundColor: '#004B87',
                    borderRadius: 4,
                    hoverBackgroundColor: '#003366'
                }]
            };
            charts.department.update();
        }

        // Initialize App
        window.onload = () => {
            buildFilters();
            initCharts();
            
            // Set up search listener with small debounce
            let timeout = null;
            document.getElementById('searchInput').addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(updateDashboard, 300);
            });

            // Handle window resize for responsive charts
            window.addEventListener('resize', () => {
                if (charts.location) {
                    const newPos = window.innerWidth < 768 ? 'bottom' : 'right';
                    if (charts.location.options.plugins.legend.position !== newPos) {
                        charts.location.options.plugins.legend.position = newPos;
                        charts.location.update();
                    }
                }
            });
            
            // Initial render
            updateDashboard();
        };
    </script>
</body>
</html>
